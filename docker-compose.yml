services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifemirror
      POSTGRES_PASSWORD: lifemirror
      POSTGRES_DB: lifemirror
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifemirror -d lifemirror"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
